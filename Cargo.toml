[workspace]
resolver = "3"
members = [
    "crates/domain",
    "crates/application",
    "crates/media",
    "crates/v1compat",
    "apps/desktop",
]
default-members = ["apps/desktop"]

[workspace.package]
version = "2.0.0-alpha.6"
edition = "2024"
rust-version = "1.98"
license-file = "LICENSE.md"
authors = ["Gabriel Sequera"]
repository = "https://github.com/Gabosequera/transcriber-v2"

[workspace.dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
thiserror = "2.0.20"
anyhow = "1.0.104"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
sha2 = "0.11.0"
hex = "0.4.3"
rand = "0.10.2"
tempfile = "3.27.0"
crossbeam-channel = "0.5.17"
parking_lot = "0.12.5"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
eframe = { version = "0.36.1", features = ["wgpu", "persistence"] }
egui = "0.36.1"
egui_extras = { version = "0.36.1", features = ["all_loaders"] }
rfd = "0.17.2"
cpal = "0.18.2"

[profile.release]
opt-level = 3
debug = "line-tables-only"
codegen-units = 4
lto = "thin"
panic = "unwind"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
