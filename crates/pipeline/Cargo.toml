[package]
name = "tv2-pipeline"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
description = "Supervisión opcional de inferencia local y resultados ligados al proyecto."

[dependencies]
tv2-domain = { path = "../domain" }
tv2-application = { path = "../application" }
tv2-media = { path = "../media" }
tv2-v1compat = { path = "../v1compat" }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
crossbeam-channel = { workspace = true }
tracing = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp"] }

[dev-dependencies]
tempfile = { workspace = true }
tracing-subscriber = { workspace = true }
